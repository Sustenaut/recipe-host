name: ci

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  # pubkit's shared Node CI: the locked dependencies without their install
  # scripts, pubkit sync --check, the tests and, with the SONAR_TOKEN secret,
  # SonarQube Cloud. `passed` is the one check a ruleset requires.
  #
  # The app in app/ only runs in a browser, so its coverage comes from the
  # Playwright tests, which run in the browser job beside the unit tests.
  # The sonar job reads both jobs' reports from coverage/; test/ is
  # analysed as test code.
  ci:
    uses: schryer/pubkit/.github/workflows/node-ci.yml@v0.12.4
    with:
      browser-test: npm run test:browser
      coverage-report: coverage/
      sonar-args: -Dsonar.tests=test -Dsonar.exclusions=test/**
    secrets: inherit

  # The shared release workflow: on a pull request, a code change records
  # what it changes with `pubrel add`, and a release is the bump those rows
  # require, published; on main, a published version is tagged and
  # released, and jsDelivr is warmed at the new tag. CI signs nothing; the
  # release was signed when the package publet was published.
  release:
    needs: ci
    uses: schryer/pubrel/.github/workflows/release.yml@v0.5.4
    with: { pubrel-version: v0.5.4 }
    permissions:
      contents: write
