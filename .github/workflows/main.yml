# Written by `pubkit sync` from the ci block of pubkit.json. Do not edit:
# change pubkit.json and run `pubkit sync`.
name: main

on:
  push: { branches: [main] }

permissions:
  contents: read

jobs:
  test:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-node-test.yml@f0984614ce18dd9f5eedfb7a39451c2bff89d232 # v0.17.0
    with: {"coverage-report": "coverage/"}

  browser:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-node-browser.yml@f0984614ce18dd9f5eedfb7a39451c2bff89d232 # v0.17.0
    with: {"browser-test": "npm run test:browser"}

  audit:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-node-audit.yml@f0984614ce18dd9f5eedfb7a39451c2bff89d232 # v0.17.0

  osv:
    name: ci
    uses: Sustenaut/pubkit/.github/workflows/job-osv.yml@f0984614ce18dd9f5eedfb7a39451c2bff89d232 # v0.17.0

  sonar:
    name: ci
    needs: [test, browser]
    uses: Sustenaut/pubkit/.github/workflows/job-sonar.yml@f0984614ce18dd9f5eedfb7a39451c2bff89d232 # v0.17.0
    with: {"sonar-args": "-Dsonar.tests=test -Dsonar.exclusions=test/**", "reports": "sonar.javascript.lcov.reportPaths=*"}
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }

  # The one check a ruleset requires: it passes only when every job
  # above succeeded. None of them is ever skipped for not being asked for.
  passed:
    name: ci / passed
    if: always()
    needs: [test, browser, audit, osv, sonar]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}' }

  # pubrel's release workflow: on a pull request, a code change records
  # what it changes and a release is the bump its changes require; on
  # main, a published version is tagged and released.
  release:
    needs: passed
    uses: Sustenaut/pubrel/.github/workflows/release.yml@16c6c9731b3f41639d45160e8bb73d59d8562e04 # v0.5.5
    with: {"pubrel-version": "v0.5.5"}
    permissions:
      contents: write
